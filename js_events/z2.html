<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" placeholder="UnesiteIme">
    <p></p>

    <script>
        let Input = document.querySelector("input");
        let p = document.querySelector("p")

        document.addEventListener("keydown", function(event){
            if(event.key === "Enter"){
                p.textContent = "Enter";
                alert("Potvrđeno");
                return;
            }
            if(event.key === "Escape"){
                p.textContent = "Esc";
                Input.value = null;
            }
            
        })
    </script>
</body>
</html>
